<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" fill="none">
  <!-- Base Dark Slate Background -->
  <rect width="800" height="1000" fill="#0f172a"/>

  <!-- Subtle Static Geometric Shapes (Replacing Dynamic Glow) -->
  <path d="M0 0H800V1000H0V0Z" fill="#0f172a"/>
  <path d="M-100 180L850 -40V420L-100 640Z" fill="#1e293b" fill-opacity="0.55"/>
  <path d="M-50 620L900 380V880L-50 1050Z" fill="#1e293b" fill-opacity="0.35"/>

  <!-- Architectural Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.35" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="1000"/>
    <line x1="160" y1="0" x2="160" y2="1000"/>
    <line x1="240" y1="0" x2="240" y2="1000"/>
    <line x1="320" y1="0" x2="320" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="480" y1="0" x2="480" y2="1000"/>
    <line x1="560" y1="0" x2="560" y2="1000"/>
    <line x1="640" y1="0" x2="640" y2="1000"/>
    <line x1="720" y1="0" x2="720" y2="1000"/>

    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="0" y1="900" x2="800" y2="900"/>
  </g>

  <!-- Static Concentric Rings -->
  <circle cx="400" cy="460" r="260" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="400" cy="460" r="190" stroke="#2563eb" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="400" cy="460" r="120" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Database Schema Illustration Cards -->
  <!-- Card 1: Primary Table Node (Center-Left) -->
  <g transform="translate(130, 270)">
    <rect width="240" height="165" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="240" height="38" rx="12" fill="#2563eb"/>
    <rect y="26" width="240" height="12" fill="#2563eb"/>
    <circle cx="20" cy="19" r="5" fill="#93c5fd"/>
    <rect x="34" y="14" width="90" height="10" rx="5" fill="#f1f5f9"/>
    <!-- Rows -->
    <rect x="18" y="56" width="16" height="10" rx="3" fill="#60a5fa"/>
    <rect x="44" y="56" width="95" height="10" rx="4" fill="#cbd5e1"/>
    <rect x="165" y="56" width="55" height="10" rx="4" fill="#64748b"/>

    <rect x="18" y="82" width="16" height="10" rx="3" fill="#34d399"/>
    <rect x="44" y="82" width="110" height="10" rx="4" fill="#cbd5e1"/>
    <rect x="165" y="82" width="55" height="10" rx="4" fill="#64748b"/>

    <rect x="18" y="108" width="16" height="10" rx="3" fill="#34d399"/>
    <rect x="44" y="108" width="80" height="10" rx="4" fill="#cbd5e1"/>
    <rect x="165" y="108" width="55" height="10" rx="4" fill="#64748b"/>

    <rect x="18" y="134" width="16" height="10" rx="3" fill="#fbbf24"/>
    <rect x="44" y="134" width="100" height="10" rx="4" fill="#cbd5e1"/>
    <rect x="165" y="134" width="55" height="10" rx="4" fill="#64748b"/>
  </g>

  <!-- Card 2: Connected Replica/Migration Node (Right) -->
  <g transform="translate(440, 360)">
    <rect width="230" height="145" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect width="230" height="36" rx="12" fill="#334155"/>
    <rect y="24" width="230" height="12" fill="#334155"/>
    <circle cx="20" cy="18" r="5" fill="#34d399"/>
    <rect x="34" y="13" width="105" height="10" rx="5" fill="#e2e8f0"/>
    <!-- Rows -->
    <rect x="18" y="54" width="14" height="9" rx="3" fill="#60a5fa"/>
    <rect x="40" y="54" width="90" height="9" rx="4" fill="#94a3b8"/>
    <rect x="155" y="54" width="55" height="9" rx="4" fill="#475569"/>

    <rect x="18" y="80" width="14" height="9" rx="3" fill="#94a3b8"/>
    <rect x="40" y="80" width="100" height="9" rx="4" fill="#94a3b8"/>
    <rect x="155" y="80" width="55" height="9" rx="4" fill="#475569"/>

    <rect x="18" y="106" width="14" height="9" rx="3" fill="#94a3b8"/>
    <rect x="40" y="106" width="75" height="9" rx="4" fill="#94a3b8"/>
    <rect x="155" y="106" width="55" height="9" rx="4" fill="#475569"/>
  </g>

  <!-- Card 3: Query & Access Node (Bottom Center) -->
  <g transform="translate(230, 520)">
    <rect width="260" height="130" rx="12" fill="#1e293b" stroke="#2563eb" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="20" y="22" width="70" height="20" rx="6" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1"/>
    <rect x="32" y="28" width="46" height="8" rx="4" fill="#34d399"/>
    <rect x="102" y="26" width="120" height="12" rx="4" fill="#e2e8f0"/>

    <rect x="20" y="58" width="220" height="10" rx="4" fill="#475569"/>
    <rect x="20" y="78" width="180" height="10" rx="4" fill="#475569"/>
    <rect x="20" y="98" width="140" height="10" rx="4" fill="#3b82f6"/>
  </g>

  <!-- Relation Connector Lines -->
  <path d="M370 335H405V415H440" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M250 435V520" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M555 505V585H490" stroke="#34d399" stroke-width="2"/>

  <!-- Accent Nodes -->
  <circle cx="370" cy="335" r="5" fill="#60a5fa"/>
  <circle cx="440" cy="415" r="5" fill="#60a5fa"/>
  <circle cx="250" cy="435" r="5" fill="#60a5fa"/>
  <circle cx="250" cy="520" r="5" fill="#60a5fa"/>
  <circle cx="555" cy="505" r="5" fill="#34d399"/>
  <circle cx="490" cy="585" r="5" fill="#34d399"/>
</svg>
