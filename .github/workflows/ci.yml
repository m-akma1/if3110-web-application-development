name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Generate, vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Same disposable database as the `postgres-test` compose profile (make test-integration).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dbplatform_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d dbplatform_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # With this set, integration tests run instead of being skipped.
      TEST_DATABASE_URL: postgres://test:test@localhost:5433/dbplatform_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build frontend SPA
        run: npm --prefix frontend install && npm --prefix frontend run build

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error::These files are not gofmt-formatted. Run 'gofmt -w' on them."
            exit 1
          fi

      - name: go vet
        run: make vet

      - name: Build
        run: go build ./...

      - name: Test (unit + integration, race detector)
        run: go test -race -count=1 ./...

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build --tag dbplatform-app:ci .
