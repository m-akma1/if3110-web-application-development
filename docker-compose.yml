services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - app_net

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      target-postgres:
        condition: service_healthy
    networks:
      - app_net

  # Demo target database, separate from the platform DB,
  target-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # No fallbacks: compose refuses to start when one of these is missing from .env.
    environment:
      POSTGRES_USER: ${TARGET_POSTGRES_USER:?set TARGET_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${TARGET_POSTGRES_PASSWORD:?set TARGET_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${TARGET_POSTGRES_DB:?set TARGET_POSTGRES_DB in .env}
      TARGET_APP_USER: ${TARGET_APP_USER:?set TARGET_APP_USER in .env}
      TARGET_APP_PASSWORD: ${TARGET_APP_PASSWORD:?set TARGET_APP_PASSWORD in .env}
    volumes:
      - target_postgres_data:/var/lib/postgresql/data
      - ./docker/target-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Only the database's own settings; the app's secrets stay out of this container.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  # Disposable PostgreSQL for integration tests (TEST_DATABASE_URL). Not started by default:
  #   docker compose --profile test up -d postgres-test   (or: make test-integration)
  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: dbplatform_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d dbplatform_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  target_postgres_data:

networks:
  app_net:
    driver: bridge
