services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - app_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # Telemetry export. The defaults keep today's behaviour (spans and logs on stdout only);
    # `make observability` sets both exporters to otlp for the observability profile below.
    # Values from the shell or .env win over the defaults.
    environment:
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-console}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      METRICS_ADDR: ${METRICS_ADDR:-:9091}
    depends_on:
      postgres:
        condition: service_healthy
      target-postgres:
        condition: service_healthy
    networks:
      - app_net

  # Demo target database, separate from the platform DB,
  target-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Notice a dead client within ~2 minutes (60 s idle + 6 probes x 10 s) instead of the OS
    # default of ~2 hours, so a worker that died mid-batch does not keep its transaction open.
    command: ["postgres", "-c", "tcp_keepalives_idle=60", "-c", "tcp_keepalives_interval=10", "-c", "tcp_keepalives_count=6"]
    # No fallbacks: compose refuses to start when one of these is missing from .env.
    environment:
      POSTGRES_USER: ${TARGET_POSTGRES_USER:?set TARGET_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${TARGET_POSTGRES_PASSWORD:?set TARGET_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${TARGET_POSTGRES_DB:?set TARGET_POSTGRES_DB in .env}
      TARGET_APP_USER: ${TARGET_APP_USER:?set TARGET_APP_USER in .env}
      TARGET_APP_PASSWORD: ${TARGET_APP_PASSWORD:?set TARGET_APP_PASSWORD in .env}
    volumes:
      - target_postgres_data:/var/lib/postgresql/data
      - ./docker/target-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Notice a dead client within ~2 minutes, so the session advisory lock of a worker whose host
    # vanished (no FIN/RST) is released quickly; see README "Lock recovery".
    command: ["postgres", "-c", "tcp_keepalives_idle=60", "-c", "tcp_keepalives_interval=10", "-c", "tcp_keepalives_count=6"]
    # Only the database's own settings; the app's secrets stay out of this container.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  # Disposable PostgreSQL for integration tests (TEST_DATABASE_URL). Not started by default:
  #   docker compose --profile test up -d postgres-test   (or: make test-integration)
  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: dbplatform_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d dbplatform_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # ---- Observability (profile "observability", see README "Observability") ----
  # app --OTLP--> otel-collector --> tempo (traces), loki (logs); prometheus scrapes app:9091;
  # grafana reads all three. Only Grafana (and Prometheus, for debugging) are published, and only
  # on 127.0.0.1.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki
    networks:
      - app_net

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    # Tempo runs as uid 10001; its data lives in a volume that only it writes.
    user: "10001"
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - app_net

  loki:
    image: grafana/loki:3.3.2
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./docker/observability/loki.yaml:/etc/loki/config.yaml:ro
    networks:
      - app_net

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - app_net

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    # Local demo: anonymous visitors are Viewers; sign in as admin/admin to edit.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dbplatform.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - app_net

volumes:
  tempo_data:
  caddy_data:
  caddy_config:
  postgres_data:
  target_postgres_data:

networks:
  app_net:
    driver: bridge
